name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Syntax and ShellCheck
        run: |
          find scripts -type f -name '*.sh' -print0 | while IFS= read -r -d '' script; do
            echo "Checking $script..."
            bash -n "$script"
            shellcheck \
              -e SC1090 \
              -e SC1091 \
              -e SC2016 \
              -e SC2034 \
              -e SC2155 \
              "$script"
          done
